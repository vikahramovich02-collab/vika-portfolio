<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grin Dental Lab — concept C (macro)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Концепт C: ролик макро-съёмки керамики на весь экран в скруглённой рамке,
   крупный светлый заголовок сверху слева, моно-меню справа, текст и кнопка снизу. */
:root{--ink:#14171a;--paper:#f4f3ef;--lime:#d9f99d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink)}
body{font-family:"Inter Tight",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.frame{position:fixed;inset:0;overflow:hidden;background:#0d0f10}
.frame video,.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 85%}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 35%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}
.ui{position:relative;z-index:2;height:100%;padding:28px 32px;display:flex;flex-direction:column}
.btm{margin-top:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;letter-spacing:.02em}
.logo i{width:24px;height:14px;border:1.5px solid #fff;border-radius:999px;display:inline-block}
.nav{display:flex;align-items:center;gap:4px;background:rgba(244,243,239,.9);border-radius:10px;padding:5px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em;color:var(--ink);text-transform:uppercase}
.nav a{padding:10px 14px;color:inherit;text-decoration:none}
.nav a.on{background:var(--ink);color:#fff;border-radius:7px}
h1{font-weight:300;font-size:clamp(48px,6.4vw,96px);line-height:.98;letter-spacing:-.035em;margin-top:clamp(20px,4vh,44px);max-width:14ch}
.btm{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.btm p{max-width:36ch;font-size:18px;line-height:1.3;color:rgba(255,255,255,.9)}
.cta{display:flex;gap:6px}
.cta a{display:inline-flex;align-items:center;height:46px;padding:0 18px;border-radius:9px;background:var(--ink);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.cta a.go{background:var(--lime);color:var(--ink);padding:0 16px;font-size:16px}
.tag{position:absolute;right:32px;top:50%;transform:translateY(-50%);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.8);writing-mode:vertical-rl}
@media (max-width:760px){

  .nav a:not(.on){display:none}
  .ui{padding:20px}
  .btm{flex-direction:column;align-items:flex-start}
  .tag{display:none}
}
</style>
</head>
<body>
<div class="frame">
  <img src="img/macro-hero.webp" alt="">
  <video id="v" autoplay muted loop playsinline poster="img/macro-hero.webp"></video>
  <div class="ui">
    <div class="top">
      <div class="logo"><i></i>Grin Dental Lab</div>
      <nav class="nav"><a href="#">Cases</a><a href="#">Products</a><a href="#">Vasyl</a><a class="on" href="#">Send a scan</a></nav>
    </div>
    <h1>Ceramics crafted with a dentist’s eye.</h1>
    <div class="btm">
      <p>Veneers, crowns and full-arch restorations, hand-layered in San Francisco by a CDT who is also a licensed dentist.</p>
      <div class="cta"><a href="#">See our cases</a><a class="go" href="#">→</a></div>
    </div>
  </div>
  <span class="tag">e.max · hand-layered · macro 1:1</span>
</div>
<script>
  const v=document.getElementById('v');
  fetch('img/macro-hero.mp4',{method:'HEAD'}).then(r=>{if(r.ok){v.src='img/macro-hero.mp4';v.play().catch(()=>{})}});
</script>
</body>
</html>
